<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>コンプリート！</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: white;
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }

    .box {
      background: rgba(255,255,255,0.15);
      padding: 40px;
      border-radius: 24px;
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 30px;
    }

    img {
      width: 180px;
    }
  </style>
</head>
<body>

<div class="box">
  <h1>COMPLETE!</h1>
  <p>すべてのスタンプを集めました！</p>

  <img src="https://cdn-icons-png.flaticon.com/512/2583/2583344.png">
</div>

</body>
</html>
